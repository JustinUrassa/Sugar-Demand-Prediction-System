<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SugarCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="assets/css/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-overlay"></div>
  <div class="particles" id="particles"></div>

  <div class="page-scroll">
    <div class="split-layout">
      <div class="hero-side">
        

      <div class="card-side">
        <div class="login-card">
          <div class="card-shimmer"></div>

          <div class="card-brand">
            <div class="card-title" data-i18n="reset_title">Reset Password</div>
            <div class="card-subtitle" data-i18n="reset_subtitle">A secure way to recover access to your account</div>
          </div>

          <div class="form-msg" id="form-msg"><span id="msg-icon"></span><span id="msg-text"></span></div>

          <div class="form-panel active" id="panel-request">
            <form id="request-form" autocomplete="off">
              <div class="form-group">
                <label class="form-label" for="request-email" data-i18n="reset_email_label">Registered Email</label>
                <div class="input-wrap">
                  <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" style="display:none"/><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6z"/><polyline points="22 6 12 13 2 6"/></svg></span>
                  <input class="form-input" type="email" id="request-email" name="email" placeholder="Enter your email address" data-i18n-placeholder="reset_email_placeholder" required>
                </div>
              </div>

              <button type="submit" class="submit-btn" id="request-btn">
                <span id="request-btn-text" data-i18n="reset_send_link">Send reset link</span>
                <div class="btn-spinner" id="request-spinner"></div>
              </button>

              <div class="card-foot-note" style="margin-top:16px;">
                <span data-i18n="reset_have_token">Already have a reset token?</span> <a href="#" id="token-link" class="link-btn" data-i18n="reset_use_token">Use token</a>
              </div>
            </form>
          </div>

          <div class="form-panel" id="panel-reset">
            <form id="reset-form" autocomplete="off">
              <input type="hidden" id="reset-token" name="token">
              <div class="form-group">
                <label class="form-label" for="new-password" data-i18n="reset_new_password_label">New Password</label>
                <div class="input-wrap">
                  <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                  <input class="form-input" type="password" id="new-password" name="password" placeholder="Enter new password" data-i18n-placeholder="reset_new_password_placeholder" required>
                  <button type="button" class="toggle-pwd" data-target="new-password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="confirm-password" data-i18n="reset_confirm_password_label">Confirm Password</label>
                <div class="input-wrap">
                  <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                  <input class="form-input" type="password" id="confirm-password" name="password_confirm" placeholder="Confirm new password" data-i18n-placeholder="reset_confirm_password_placeholder" required>
                  <button type="button" class="toggle-pwd" data-target="confirm-password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
              </div>

              <button type="submit" class="submit-btn" id="reset-btn">
                <span id="reset-btn-text" data-i18n="reset_save_password">Save new password</span>
                <div class="btn-spinner" id="reset-spinner"></div>
              </button>

              <div class="card-foot-note" style="margin-top:16px;">
                <span data-i18n="reset_need_link">Need a new link?</span> <a href="#" id="request-link" class="link-btn" data-i18n="reset_request_email">Request reset email</a>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const requestPanel = document.getElementById('panel-request');
    const resetPanel = document.getElementById('panel-reset');
    const msgBox = document.getElementById('form-msg');
    const msgText = document.getElementById('msg-text');
    const msgIcon = document.getElementById('msg-icon');

    const requestForm = document.getElementById('request-form');
    const resetForm = document.getElementById('reset-form');
    const resetTokenInput = document.getElementById('reset-token');

    function showMsg(text, type = 'error') {
      msgBox.className = 'form-msg show ' + type;
      msgText.textContent = text;
      msgIcon.innerHTML = type === 'success'
        ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    }

    function clearMsg() {
      msgBox.className = 'form-msg';
      msgText.textContent = '';
      msgIcon.innerHTML = '';
    }

    function showRequest() {
      requestPanel.classList.add('active');
      resetPanel.classList.remove('active');
      clearMsg();
    }

    function showReset() {
      requestPanel.classList.remove('active');
      resetPanel.classList.add('active');
      clearMsg();
    }

    document.getElementById('token-link').addEventListener('click', function(e) {
      e.preventDefault();
      showReset();
    });
    document.getElementById('request-link').addEventListener('click', function(e) {
      e.preventDefault();
      showRequest();
    });

    if (token) {
      resetTokenInput.value = token;
      showReset();
    } else {
      showRequest();
    }

    requestForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('request-btn');
      const spinner = document.getElementById('request-spinner');
      const text = document.getElementById('request-btn-text');
      btn.disabled = true;
      spinner.style.display = 'block';
      text.textContent = I18n.t('reset_sending_link');
      clearMsg();

      const formData = new FormData(this);
      formData.append('action', 'forgot_password');

      const res = await fetch(App.BASE_URL + 'auth.php', { method: 'POST', body: formData });
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch (_) { data = { success: false, message: 'Unexpected server response.' }; }

      if (data.success) {
        showMsg(data.message || I18n.t('reset_success'), 'success');
      } else {
        showMsg(data.message || I18n.t('reset_send_failed'));
      }

      btn.disabled = false;
      spinner.style.display = 'none';
      text.textContent = I18n.t('reset_send_link');
    });

    resetForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('reset-btn');
      const spinner = document.getElementById('reset-spinner');
      const text = document.getElementById('reset-btn-text');
      btn.disabled = true;
      spinner.style.display = 'block';
      text.textContent = I18n.t('reset_saving_password');
      clearMsg();

      const formData = new FormData(this);
      formData.append('action', 'reset_password');

      const res = await fetch(App.BASE_URL + 'auth.php', { method: 'POST', body: formData });
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch (_) { data = { success: false, message: 'Unexpected server response.' }; }

      if (data.success) {
        showMsg(data.message || I18n.t('reset_success'), 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 2200);
      } else {
        showMsg(data.message || I18n.t('reset_reset_failed'));
      }

      btn.disabled = false;
      spinner.style.display = 'none';
      text.textContent = I18n.t('reset_save_password');
    });
  </script>
  <script src="assets/js/i18n.js"></script>
</body>
</html>
