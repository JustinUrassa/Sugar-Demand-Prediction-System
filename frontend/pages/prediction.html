              <div>

    <div class="table-wrapper" style="border:none;border-radius:0">
      <table>

// Set default date to next month
const d = new Date(); d.setMonth(d.getMonth() + 1);
document.getElementById('target-date').value = d.toISOString().split('T')[0];

function checkLayout() {
  const layout = document.getElementById('pred-layout');
  if (layout) layout.style.gridTemplateColumns = window.innerWidth < 900 ? '1fr' : '400px 1fr';
}
checkLayout();
window.addEventListener('resize', checkLayout);

// ── Import Data: CSV upload ──────────────────────────────────
function wireUploadZone(zoneId, inputId, onFile) {
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  if (!zone || !input) return;
  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => { if (input.files[0]) onFile(input.files[0]); input.value = ''; });
  ['dragover', 'dragleave', 'drop'].forEach(evt => {
    zone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
  });
  zone.addEventListener('dragover', () => zone.classList.add('drag-over'));
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    zone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) onFile(file);
  });
}

let lastCsvStats = null;

wireUploadZone('csv-upload-zone', 'pred-csv-input', async (file) => {
  if (!file.name.toLowerCase().endsWith('.csv')) { App.toast(I18n.t('pred_csv_only'), 'error'); return; }
  App.showLoading();
  try {
    const fd = new FormData();
    fd.append('action', 'upload_csv');
    fd.append('csv_file', file);
    const res = await App.api(App.BASE_URL + 'sales.php', fd, 'POST');
    if (!res.success) { App.toast(res.message || I18n.t('pred_import_failed'), 'error'); return; }
    App.toast(res.message, 'success');

    const statsRes = await App.api(App.BASE_URL + 'sales.php', { action: 'recent_stats', days: 30 }, 'GET');
    if (statsRes.success && statsRes.record_count > 0) {
      lastCsvStats = statsRes;
      document.getElementById('csv-review-title').textContent = I18n.t('pred_csv_review_title');
      document.getElementById('csv-review-body').textContent =
        `${I18n.t('pred_last')} ${statsRes.days} ${I18n.t('pred_days')}: ${App.fmtNum(statsRes.total_qty)} kg ${I18n.t('pred_total')}, ` +
        `${I18n.t('pred_avg_price')} Tsh ${App.fmtNum(statsRes.avg_price, 2)} (${statsRes.record_count} ${I18n.t('pred_records')})`;
      document.getElementById('csv-review').classList.remove('hidden');
    }
  } catch (err) {
    console.error('CSV import failed:', err);
    App.toast(I18n.t('pred_import_failed'), 'error');
  } finally {
    App.hideLoading();
  }
});

document.getElementById('csv-use-btn').addEventListener('click', () => {
  if (!lastCsvStats) return;
  document.getElementById('prev-sales').value = lastCsvStats.total_qty.toFixed(2);
  document.getElementById('price').value = lastCsvStats.avg_price.toFixed(2);
  App.toast(I18n.t('pred_values_applied'), 'success');
  document.getElementById('prev-sales').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

// ── Import Data: receipt/ledger photo upload (OCR) ───────────
wireUploadZone('photo-upload-zone', 'pred-photo-input', async (file) => {
  if (!file.type.startsWith('image/')) { App.toast(I18n.t('pred_photo_only'), 'error'); return; }
  App.showLoading();
  try {
    const fd = new FormData();
    fd.append('action', 'ocr_extract');
    fd.append('receipt_image', file);
    const res = await App.api(App.BASE_URL + 'sales.php', fd, 'POST');
    if (!res.success) { App.toast(res.message || I18n.t('pred_ocr_failed'), 'error'); return; }

    const ex = res.extracted || {};
    document.getElementById('ocr-date').value = ex.sale_date || '';
    document.getElementById('ocr-qty').value = ex.quantity_kg ?? '';
    document.getElementById('ocr-price').value = ex.price_per_kg ?? '';
    document.getElementById('ocr-raw-text').textContent = res.raw_text || '';
    document.getElementById('photo-review').classList.remove('hidden');
    App.toast(I18n.t('pred_ocr_done'), 'success');
  } catch (err) {
    console.error('OCR extract failed:', err);
    App.toast(I18n.t('pred_ocr_failed'), 'error');
  } finally {
    App.hideLoading();
  }
});

document.getElementById('ocr-use-btn').addEventListener('click', () => {
  const qty = document.getElementById('ocr-qty').value;
  const price = document.getElementById('ocr-price').value;
  if (qty) document.getElementById('prev-sales').value = qty;
  if (price) document.getElementById('price').value = price;
  App.toast(I18n.t('pred_values_applied'), 'success');
  document.getElementById('prev-sales').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

document.getElementById('ocr-save-btn').addEventListener('click', async () => {
  const date = document.getElementById('ocr-date').value;
  const qty = document.getElementById('ocr-qty').value;
  const price = document.getElementById('ocr-price').value;
  if (!date || !qty || !price) { App.toast(I18n.t('pred_ocr_missing_fields'), 'error'); return; }

  const btn = document.getElementById('ocr-save-btn');
  btn.disabled = true;
  try {
    const res = await App.api(App.BASE_URL + 'sales.php', {
      action: 'add', sale_date: date, quantity_kg: qty, price_per_kg: price,
      market_location: 'Mbeya Central Market', sugar_type: 'brown',
      supplier_name: '', season: document.getElementById('season-sel')?.value || 'dry', is_holiday: 0,
    }, 'POST');
    if (res.success) {
      App.toast(I18n.t('pred_ocr_saved'), 'success');
      document.getElementById('photo-review').classList.add('hidden');
    } else {
      App.toast(res.message || I18n.t('pred_import_failed'), 'error');
    }
  } catch (err) {
    console.error('Save OCR record failed:', err);
    App.toast(I18n.t('pred_import_failed'), 'error');
  } finally {
    btn.disabled = false;
  }
});

async function loadHistory() {
  const tbody = document.getElementById('history-tbody');
  const res = await App.api(App.BASE_URL + 'recommendations.php', { action: 'list', limit: 15, _: Date.now() }, 'GET');
  const rows = (res && res.success && Array.isArray(res.data)) ? res.data : [];

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--text-muted)" data-i18n="pred_history_empty">No estimates yet. Run your first calculation above.</td></tr>';
    if (typeof I18n !== 'undefined') I18n.init();
    return;
  }

  const riskBadge = r => `<span class="badge risk-${r}">${r}</span>`;
  tbody.innerHTML = rows.map((r, i) => `
    <tr>
      <td class="text-muted">${i + 1}</td>
      <td>${App.fmtDate(r.created_at)}</td>
      <td><strong>${App.fmtDate(r.target_date)}</strong></td>
      <td class="font-mono">${r.previous_sales !== undefined && r.previous_sales !== null ? App.fmtNum(r.previous_sales) + ' kg' : '—'}</td>
      <td class="font-mono">${r.input_price !== undefined && r.input_price !== null ? 'Tsh ' + Number(r.input_price).toLocaleString() : '—'}</td>
      <td><span class="badge badge-neutral">${r.input_season || '—'}</span></td>
      <td class="font-mono" style="color:var(--brand-primary);font-weight:700">${App.fmtNum(r.estimated_demand)} kg</td>
      <td class="font-mono">${App.fmtNum(r.recommended_stock)} kg</td>
      <td>${riskBadge(r.risk_level)}</td>
    </tr>`).join('');
}
loadHistory();

window.clearHistory = () => {
  App.toast('Refreshing from server…', 'info');
  loadHistory();
};

let vizChart = null;

document.getElementById('pred-form').addEventListener('submit', async function (e) {
  e.preventDefault();

  const btn    = document.getElementById('pred-btn');
  const btnTxt = document.getElementById('pred-btn-text');
  btn.disabled = true; btnTxt.textContent = 'Calculating…';
  App.showLoading();

  const prevSales  = parseFloat(document.getElementById('prev-sales').value);
  const price      = parseFloat(document.getElementById('price').value);
  const season     = document.getElementById('season-sel').value;
  const isHoliday  = document.getElementById('is-holiday').checked ? 1 : 0;
  const targetDate = document.getElementById('target-date').value;
  const curStock   = parseFloat(document.getElementById('cur-stock').value) || 0;

  // ── Ask the backend for a real prediction ──────────────
  // predict.php pulls sales history and runs the trained ML model
  // (falling back to the statistical formula when there isn't yet
  // enough continuous history). Either way it writes a row to
  // predictions + recommendations, so this is what makes the
  // estimate show up on the Dashboard and Recommendations pages.
  const res = await App.api(App.BASE_URL + 'predict.php', {
    action: 'predict',
    target_date: targetDate,
    prev_sales: prevSales,
    price, season,
    is_holiday: isHoliday,
    current_stock: curStock,
  }, 'POST');

  App.hideLoading();
  btn.disabled = false; btnTxt.textContent = 'Calculate Estimate';

  if (!res.success) {
    App.toast(res.message || 'Failed to calculate estimate.', 'error');
    return;
  }

  const estimated = Number(res.predicted_demand) || 0;
  const lower     = Number(res.lower_bound) || 0;
  const upper     = Number(res.upper_bound) || 0;
  const confidence= Number(res.confidence) || 0;
  const isMl      = res.model_used === 'ml_linear_regression';
  const rec       = res.recommendation || {};
  const recStock  = Number(rec.recommended_stock) || 0;
  const risk      = rec.risk_level || 'low';
  const gap       = recStock - curStock;

  const actionClassMap = { critical: 'alert-danger', medium: 'alert-warning', low: 'alert-success' };
  const actionClass = actionClassMap[risk] || 'alert-success';
  const actionText  = rec.action_required || 'Stock levels are adequate. No immediate action required.';

  // ── Show results ───────────────────────────────────────
  document.getElementById('results-placeholder').classList.add('hidden');
  document.getElementById('results-content').classList.remove('hidden');

  document.getElementById('res-demand').textContent    = App.fmtNum(Math.round(estimated)) + ' kg';
  document.getElementById('rec-stock-big').textContent = App.fmtNum(Math.round(recStock)) + ' kg';
  document.getElementById('res-risk').innerHTML        = `<span class="badge risk-${risk}">${risk}</span>`;
  document.getElementById('res-lower').textContent     = App.fmtNum(Math.round(lower)) + ' kg';
  document.getElementById('res-upper').textContent     = App.fmtNum(Math.round(upper)) + ' kg';
  document.getElementById('rec-stock').textContent     = App.fmtNum(Math.round(recStock)) + ' kg';
  document.getElementById('rec-current').textContent   = curStock ? App.fmtNum(curStock) + ' kg' : 'Not entered';

  // Model badge — replaces the old static "Calculated" label with
  // which method actually produced this number, and how confident it is.
  const statusBadge = document.getElementById('res-status-badge');
  statusBadge.textContent = (isMl ? 'ML Model' : 'Statistical') + ' · ' + confidence + '% confidence';
  statusBadge.className = 'badge ' + (isMl ? 'badge-success' : 'badge-neutral');

  const gapEl = document.getElementById('rec-gap');
  gapEl.textContent = (gap > 0 ? '−' : '+') + App.fmtNum(Math.abs(Math.round(gap))) + ' kg';
  gapEl.style.color = gap > 0 ? 'var(--danger)' : 'var(--success)';

  const recBadge = document.getElementById('rec-risk-badge');
  recBadge.className = `badge risk-${risk}`; recBadge.textContent = risk;

  const actionDiv = document.getElementById('rec-action-div');
  actionDiv.className = `alert ${actionClass}`;
  actionDiv.innerHTML = `<div class="alert-text">${actionText}</div>`;

  // ── Chart ──────────────────────────────────────────────
  if (vizChart) vizChart.destroy();
  vizChart = new Chart(document.getElementById('pred-viz-chart'), {
    type: 'bar',
    data: {
      labels: ['Previous Sales', 'Estimated Demand', 'Low Range', 'High Range', 'Rec. Stock'],
      datasets: [{
        label: 'Quantity (kg)',
        data: [prevSales, Math.round(estimated), Math.round(lower), Math.round(upper), Math.round(recStock)],
        backgroundColor: ['rgba(148,163,184,.6)','rgba(249,115,22,.8)','rgba(16,185,129,.6)','rgba(239,68,68,.6)','rgba(59,130,246,.8)'],
        borderRadius: 6, borderSkipped: false,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${App.fmtNum(ctx.parsed.y)} kg` } } },
      scales: { y: { ticks: { callback: v => App.fmtNum(v) + ' kg' } }, x: { grid: { display: false } } }
    }
  });

  await loadHistory();

  App.toast('Estimate saved — check the Dashboard or Recommendations page to see it.', 'success');
  document.getElementById('results-content').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

// Listen for language changes and re-render
window.addEventListener('i18n:changed', () => {
  I18n.init();
  loadHistory();
});
</script>
</body>
</html>
