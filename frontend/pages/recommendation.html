<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommendations — SugarCast</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .rec-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform .18s, box-shadow .18s;
    }
    .rec-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .rec-card-top   { padding: 18px 20px 14px; border-bottom: 1px solid var(--divider); }
    .rec-card-body  { padding: 14px 20px 18px; }
      body.recommendation-page .rec-card.critical .rec-card-top,
      body.recommendation-page .rec-card.high .rec-card-top,
      body.recommendation-page .rec-card.medium .rec-card-top,
      body.recommendation-page .rec-card.low .rec-card-top { border-left: none !important; }
      /* Also remove border-left set on the .rec-card element itself (from main.css) */
      body.recommendation-page .rec-card.critical,
      body.recommendation-page .rec-card.high,
      body.recommendation-page .rec-card.medium,
      body.recommendation-page .rec-card.low { border-left: none !important; }
      /* Stronger catch-all: ensure no left border remains on rec cards */
      body.recommendation-page .rec-card,
      body.recommendation-page .rec-grid .rec-card { border-left: 0 !important; border-left-width: 0 !important; }
    .rec-grid  { display: grid; grid-template-columns: repeat(auto-fill,minmax(3,1fr)); gap: 18px; margin-bottom: 28px; }
    .kpi-row   { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 12px 0; }
    .kpi-cell  { background: var(--bg-elevated); border-radius: 8px; padding: 8px 10px; text-align: center; }
    .kpi-val   { font-size: 1.05rem; font-weight: 800; color: var(--text-primary); line-height: 1.2; }
    .kpi-lbl   { font-size: 0.67rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }
    .fill-bar  { height: 7px; background: var(--bg-elevated); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
    .fill-fill { height: 100%; border-radius: 999px; transition: width .5s ease; }
    .charts-row { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; margin-bottom: 24px; }
    .ack-tag { display:inline-block; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; border-radius:999px; font-size:0.7rem; font-weight:700; padding:3px 10px; }
    @media(max-width:900px){ .charts-row{grid-template-columns:1fr} }
    @media(max-width:600px){ .rec-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
Layout.inject(I18n.t('rec_title'), I18n.t('rec_subtitle'));

const riskColors = { critical:'#ef4444', high:'#f97316', medium:'#f59e0b', low:'#10b981' };
const riskDesc   = {
  critical: 'rec_risk_desc_critical',
  high:     'rec_risk_desc_high',
  medium:   'rec_risk_desc_medium',
  low:      'rec_risk_desc_low',
};



document.getElementById('main-content').innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 class="page-title" data-i18n="rec_title"></h1>
      <p class="page-subtitle" data-i18n="rec_subtitle"></p>
    </div>
    <a href="prediction.html" class="btn btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:6px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span data-i18n="rec_new_est">New Estimate</span>
    </a>
  </div>

  <!-- Stats -->
  <div class="stat-grid" style="margin-bottom:28px">
    <div class="stat-card orange">
      <div class="stat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
      <div class="stat-value" id="stat-active">0</div>
      <div class="stat-label" data-i18n="stat_active_recs"></div>
    </div>
    <div class="stat-card" style="border-top-color:#ef4444">
      <div class="stat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
      <div class="stat-value" id="stat-critical">0</div>
      <div class="stat-label" data-i18n="stat_critical_alerts"></div>
    </div>
    <div class="stat-card green">
      <div class="stat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="stat-value" id="stat-ack">0</div>
      <div class="stat-label" data-i18n="stat_acknowledged"></div>
    </div>
    <div class="stat-card blue">
      <div class="stat-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
      <div class="stat-value" id="stat-avg-stock">0 kg</div>
      <div class="stat-label" data-i18n="stat_avg_recommended_stock"></div>
    </div>
  </div>

  <!-- Critical Alert Banner -->
  <div class="alert alert-danger" id="critical-banner" style="margin-bottom:24px;border-radius:12px;display:none">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <div style="flex:1">
      <div class="alert-title" id="rec-alert-title" data-i18n="rec_alert_title">Critical Stock Shortage</div>
      <div class="alert-text" id="rec-alert-text"></div>
    </div>
    <button class="btn btn-danger btn-sm" style="white-space:nowrap;flex-shrink:0" id="rec-alert-ack-btn" data-i18n="btn_acknowledge">Acknowledge</button>
  </div>

  <!-- Recommendation Cards -->
  <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px" data-i18n="rec_active_recommendations"></div>
  <div class="rec-grid" id="rec-cards"></div>
  <div id="rec-empty" style="display:none;text-align:center;padding:48px 20px;color:var(--text-muted);background:var(--bg-surface);border:1px dashed var(--border);border-radius:16px;margin-bottom:28px">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.5;margin-bottom:10px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <div style="font-weight:700;color:var(--text-primary);margin-bottom:4px" data-i18n="rec_empty_title">No recommendations yet</div>
    <div style="font-size:0.85rem;max-width:380px;margin:0 auto" data-i18n="rec_empty_text">Run a demand estimate first — a stock recommendation is generated automatically for every estimate you make.</div>
  </div>

  <!-- Charts -->
  <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px" data-i18n="rec_stock_analysis"></div>
  <div class="charts-row">
    <div class="card">
      <div class="card-header">
        <span class="card-title" data-i18n="rec_stock_vs_demand">Stock vs Demand Comparison</span>
        <div style="display:flex;gap:6px">
          <span class="badge badge-info" data-i18n="rec_chart_current">Current</span>
          <span class="badge badge-orange" data-i18n="rec_chart_recommended">Recommended</span>
          <span class="badge badge-success" data-i18n="rec_chart_demand">Demand</span>
        </div>
      </div>
      <div class="card-body"><div class="chart-wrapper" style="height:260px"><canvas id="stock-chart"></canvas></div></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title" data-i18n="rec_risk_distribution">Risk Distribution</span></div>
      <div class="card-body"><div class="chart-wrapper" style="height:260px"><canvas id="risk-chart"></canvas></div></div>
    </div>
  </div>

  <!-- History Table -->
  <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px" data-i18n="rec_all_recommendations">All Recommendations</div>
  <div class="card">
    <div class="table-wrapper" style="border:none;border-radius:0;overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th data-i18n="table_target_date">Target Date</th><th data-i18n="table_estimated">Estimated</th><th data-i18n="table_recommended">Recommended</th>
            <th data-i18n="table_current">Current</th><th data-i18n="table_gap">Gap</th><th data-i18n="table_risk">Risk</th><th data-i18n="table_status">Status</th><th data-i18n="table_action_required">Action Required</th>
          </tr>
        </thead>
        <tbody id="rec-tbody"></tbody>
      </table>
    </div>
  </div>
`;

let recData = [];

// ── Load live recommendations from the backend ──────────────
async function loadRecommendations() {
  // Cache-buster (_=timestamp) guarantees this never serves a stale
  // cached response, from the browser or an intermediary proxy.
  const res = await App.api(App.BASE_URL + 'recommendations.php', { action: 'list', limit: 200, _: Date.now() }, 'GET');
  recData = (res && res.success && Array.isArray(res.data)) ? res.data : [];
  // Normalize numeric fields (PHP may return strings) and null current_stock
  recData.forEach(r => {
    r.recommended_stock = Number(r.recommended_stock) || 0;
    r.estimated_demand  = Number(r.estimated_demand) || 0;
    r.current_stock     = r.current_stock === null || r.current_stock === undefined ? null : Number(r.current_stock);
    r.is_acknowledged   = !!Number(r.is_acknowledged);
  });
  // ── Diagnostic marker ────────────────────────────────────
  // Open DevTools (F12) → Console on this page. This line proves
  // (a) this exact file is the one running, and (b) exactly what
  // the database actually returned — not what the UI displays.
  console.log(
    '%c[SugarCast] recommendation.html (live-data build) loaded — ' + new Date().toLocaleTimeString(),
    'color:#0f766e;font-weight:bold'
  );
  console.log('[SugarCast] recommendations.php returned', recData.length, 'row(s):', recData);
  // Most recent first (API already orders by created_at DESC)
  renderStats();
  renderCriticalBanner();
  renderCards();
  renderTable();
  setTimeout(initCharts, 80);
}

function renderStats() {
  const active   = recData.filter(r => !r.is_acknowledged).length;
  const critical = recData.filter(r => r.risk_level === 'critical' && !r.is_acknowledged).length;
  const ack      = recData.filter(r => r.is_acknowledged).length;
  const avgStock = recData.length ? recData.reduce((s, r) => s + r.recommended_stock, 0) / recData.length : 0;

  document.getElementById('stat-active').textContent    = active;
  document.getElementById('stat-critical').textContent  = critical;
  document.getElementById('stat-ack').textContent       = ack;
  document.getElementById('stat-avg-stock').textContent = App.fmtNum(avgStock) + ' kg';
}

function renderCriticalBanner() {
  const banner = document.getElementById('critical-banner');
  const criticalRec = recData.find(r => r.risk_level === 'critical' && !r.is_acknowledged);
  if (!criticalRec) { banner.style.display = 'none'; return; }

  banner.style.display = 'flex';
  const current = criticalRec.current_stock ?? 0;
  const gap = criticalRec.recommended_stock - current;
  document.getElementById('rec-alert-text').textContent = I18n.t('rec_alert_text', {
    current: App.fmtNum(current),
    gap: App.fmtNum(Math.abs(gap)),
    recommended: App.fmtNum(criticalRec.recommended_stock),
  });
  const btn = document.getElementById('rec-alert-ack-btn');
  btn.onclick = () => acknowledgeRec(criticalRec.id);
}

function modelBadge(r) {
  const isMl = r.model_used === 'ml_linear_regression';
  const label = isMl ? I18n.t('rec_model_ml') : I18n.t('rec_model_stat');
  const color = isMl ? '#0f766e' : '#64748b';
  return `<span style="font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${color};background:${color}18;border:1px solid ${color}40;border-radius:999px;padding:2px 8px">${label}</span>`;
}

function renderCards() {
  const grid  = document.getElementById('rec-cards');
  const empty = document.getElementById('rec-empty');

  const activeRecs = recData.filter(r => !r.is_acknowledged);
  if (!activeRecs.length) {
    grid.innerHTML = '';
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  const sortedActive = activeRecs.sort((a, b) => {
    const riskOrder = { critical: 0, high: 1, medium: 2, low: 3 };
    if (riskOrder[a.risk_level] !== riskOrder[b.risk_level]) {
      return riskOrder[a.risk_level] - riskOrder[b.risk_level];
    }
    return new Date(b.created_at) - new Date(a.created_at);
  });

  const cardsToShow = sortedActive.slice(0, 3);
  grid.style.display = '';
  empty.style.display = 'none';

  grid.innerHTML = cardsToShow.map(r => {
    const current  = r.current_stock ?? 0;
    const hasStock = r.current_stock !== null;
    const gap      = r.recommended_stock - current;
    const fillPct  = hasStock ? Math.min(100, (current / r.recommended_stock) * 100) : 0;
    const gapColor = gap > 0 ? '#ef4444' : '#10b981';
    return `
      <div class="rec-card ${r.risk_level}" id="rec-card-${r.id}">
        <div class="rec-card-top">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div>
                <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted)">${I18n.t('rec_period_ending')}</div>
                <div style="font-size:1.1rem;font-weight:700;color:var(--text-primary);margin-top:2px">${App.fmtDate(r.target_date)}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              <span class="badge risk-${r.risk_level}">${I18n.t('rec_risk_' + r.risk_level)}</span>
            </div>
          </div>
            <div style="font-size:1.9rem;font-weight:800;color:var(--text-primary);line-height:1">${App.fmtNum(r.recommended_stock)} <span style="font-size:1rem;font-weight:500;color:var(--text-muted)">kg</span></div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
              <div style="font-size:0.75rem;color:var(--text-muted)">${I18n.t('rec_recommended_stock_lbl')}</div>
              ${modelBadge(r)}
            </div>
        </div>
        <div class="rec-card-body">
          <div class="kpi-row">
            <div class="kpi-cell">
              <div class="kpi-val">${App.fmtNum(r.estimated_demand)}</div>
                <div class="kpi-lbl">${I18n.t('rec_estimated_kg')}</div>
            </div>
            <div class="kpi-cell">
              <div class="kpi-val" style="color:${hasStock ? gapColor : 'var(--text-muted)'}">${hasStock ? App.fmtNum(current) : '—'}</div>
                <div class="kpi-lbl">${I18n.t('rec_current_kg')}</div>
            </div>
            <div class="kpi-cell">
              <div class="kpi-val" style="color:${hasStock ? gapColor : 'var(--text-muted)'}">${hasStock ? (gap > 0 ? '-' : '+') + App.fmtNum(Math.abs(gap)) : '—'}</div>
                <div class="kpi-lbl">${gap > 0 ? I18n.t('rec_shortage') : I18n.t('rec_surplus')}</div>
            </div>
          </div>

          <div style="font-size:0.73rem;color:var(--text-muted);display:flex;justify-content:space-between;margin-bottom:3px">
            <span>${I18n.t('rec_stock_coverage')}</span>
            <span style="color:${gapColor};font-weight:700">${hasStock ? fillPct.toFixed(0) + '%' : '—'}</span>
          </div>
          <div class="fill-bar">
            <div class="fill-fill" style="width:${fillPct}%;background:${riskColors[r.risk_level] || riskColors.low}"></div>
          </div>

          <div style="font-size:0.82rem;color:var(--text-secondary);margin:12px 0;line-height:1.55">${I18n.t(riskDesc[r.risk_level]) || r.action_required || ''}</div>

          ${!r.is_acknowledged
            ? `<button class="btn btn-secondary w-full btn-sm" onclick="acknowledgeRec(${r.id})">${I18n.t('btn_acknowledge')}</button>`
            : ''}
        </div>
      </div>`;
  }).join('');
}

function renderTable() {
  const tbody = document.getElementById('rec-tbody');
  if (!recData.length) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-muted)">${I18n.t('lbl_no_data')}</td></tr>`;
    return;
  }
  tbody.innerHTML = recData.map(r => {
    const current  = r.current_stock ?? 0;
    const hasStock = r.current_stock !== null;
    const gap = r.recommended_stock - current;
    return `<tr>
      <td><strong>${App.fmtDate(r.target_date)}</strong></td>
      <td class="font-mono">${App.fmtNum(r.estimated_demand)} kg</td>
      <td class="font-mono" style="color:var(--brand-primary)">${App.fmtNum(r.recommended_stock)} kg</td>
      <td class="font-mono">${hasStock ? App.fmtNum(current) + ' kg' : '—'}</td>
      <td class="font-mono" style="color:${!hasStock ? 'var(--text-muted)' : (gap>0?'var(--danger)':'var(--success)')}">${hasStock ? (gap>0?'−':'+') + App.fmtNum(Math.abs(gap)) + ' kg' : '—'}</td>
      <td><span class="badge risk-${r.risk_level}">${I18n.t('rec_risk_' + r.risk_level)}</span></td>
      <td>${r.is_acknowledged ? `<span class="badge badge-success">${I18n.t('status_done')}</span>` : `<span class="badge badge-warning">${I18n.t('status_pending')}</span>`}</td>
      <td style="font-size:0.8rem;color:var(--text-secondary);max-width:220px">${r.action_required || '—'}</td>
    </tr>`;
  }).join('');
}

window.acknowledgeRec = async (id) => {
  const rec = recData.find(r => r.id === id);
  if (!rec || rec.is_acknowledged) return;

  App.showLoading();
  const res = await App.api(App.BASE_URL + 'recommendations.php', { action: 'acknowledge', id }, 'POST');
  App.hideLoading();

  if (!res.success) {
    App.toast(res.message || 'Failed to acknowledge.', 'error');
    return;
  }

  rec.is_acknowledged = true;
  renderStats();
  renderCriticalBanner();
  renderCards();
  renderTable();
  App.toast(I18n.t('rec_acknowledged'), 'success');
};

let stockChart = null, riskChart = null;

function initCharts() {
  if (stockChart) stockChart.destroy();
  if (riskChart)  riskChart.destroy();
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

  // Charts read newest-first data; show chronologically (oldest → newest)
  const chartData = [...recData].reverse();

  stockChart = new Chart(document.getElementById('stock-chart'), {
    type: 'bar',
    data: {
      labels: chartData.map(r => App.fmtDate(r.target_date)),
      datasets: [
        { label:I18n.t('rec_chart_current'),    data: chartData.map(r=>r.current_stock ?? 0),  backgroundColor:'rgba(59,130,246,.7)',  borderRadius:6 },
        { label:I18n.t('rec_chart_recommended'),data: chartData.map(r=>r.recommended_stock),backgroundColor:'rgba(249,115,22,.7)', borderRadius:6 },
        { label:I18n.t('rec_chart_demand'), data: chartData.map(r=>r.estimated_demand), backgroundColor:'rgba(16,185,129,.7)', borderRadius:6 },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ position:'top', align:'end', labels:{ boxWidth:10, padding:12 } } },
      scales:{ x:{ grid:{ display:false } }, y:{ ticks:{ callback:v=>App.fmtNum(v)+' kg' }, grid:{ color: isDark?'rgba(255,255,255,.04)':'rgba(0,0,0,.04)' } } }
    }
  });

  const riskCounts = {
    critical: recData.filter(r => r.risk_level === 'critical').length,
    medium:   recData.filter(r => r.risk_level === 'medium').length,
    low:      recData.filter(r => r.risk_level === 'low').length,
  };

  riskChart = new Chart(document.getElementById('risk-chart'), {
    type: 'doughnut',
    data: {
      labels: [I18n.t('rec_risk_critical'), I18n.t('rec_risk_medium'), I18n.t('rec_risk_low')],
      datasets: [{ data:[riskCounts.critical, riskCounts.medium, riskCounts.low], backgroundColor:['#ef4444','#f59e0b','#10b981'], borderWidth:3, borderColor: isDark?'#0f1c2e':'#fff', hoverOffset:8 }]
    },
    options: { responsive:true, maintainAspectRatio:false, cutout:'65%',
      plugins:{ legend:{ position:'bottom', labels:{ padding:14, boxWidth:10 } } }
    }
  });
}

loadRecommendations();

// Re-render when language changes so dynamic templates update
window.addEventListener('i18n:changed', () => {
  renderStats(); renderCriticalBanner(); renderCards(); renderTable(); setTimeout(initCharts, 120);
});
</script>
</body>
</html>
